[profile.default]
src = "claim-distributor/contracts"
test = "claim-distributor/test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=node_modules/forge-std/src/"
]
