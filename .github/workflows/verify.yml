name: Verify public contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  claim-distributor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
